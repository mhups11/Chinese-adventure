</style></head><body><div class="app"><header><strong>🐻 國語大冒險</strong><span id="who" class="pill"></span></header><main id="main"></main><div class="footer">五年級國語第7～12課與統整活動三、四｜150題進階鑑別版（教師審題用）｜進度儲存於本機瀏覽器</div></div><script>
const DATA={"zones":[{"name":"詩韻山谷","emoji":"🏔️","lesson":"美景閒情——詩兩首","questions":[{"q":"〈鹿柴〉寫「空山不見人，但聞人語響」，下列哪一項分析最周全？","options":["藉人聲反襯山林幽靜，並形成聽覺與視覺的對照","以聲音凸顯山中有人的熱鬧氣氛","以視覺景物為主，聲音只交代人物位置","透過聲音呈現詩人與山中人的交流"],"answer":0,"hint":"比較「不見」與「但聞」，思考聲音如何影響整體氣氛。"},{"q":"〈鹿柴〉「返景入深林，復照青苔上」的描寫重點是什麼？","options":["夜晚月光照亮溪流，鳥兒驚飛","夕陽餘光進入林間，再映照青苔","陽光直射廣場，顯得熱鬧","雨水流過青苔，形成水聲"],"answer":1,"hint":"注意「返景」指夕陽返照的光影。"},{"q":"〈鳥鳴澗〉「月出驚山鳥，時鳴春澗中」，最適合用哪一個說法解釋？","options":["月亮升起後山鳥持續大聲吵鬧，破壞寧靜","山鳥因人群聚集而驚飛","偶爾的鳥鳴更顯春夜山澗的幽靜","詩人因害怕鳥鳴而離開山谷"],"answer":2,"hint":"從「時鳴」的偶發聲音與整首詩的寧靜氣氛思考。"},{"q":"比較〈鹿柴〉與〈鳥鳴澗〉，哪一項是兩首詩在「聲音」運用上的共同點？","options":["兩首都只以聲音描寫熱鬧的人群","兩首都用密集對話推進情節","兩首都把聲音當作對自然的抱怨","兩首都透過偶爾出現的聲響襯托寧靜"],"answer":3,"hint":"想想人語與鳥鳴雖不同，卻如何共同營造意境。"},{"q":"關於第7課兩首詩的「五言絕句」，哪一項同時符合句數、字數及押韻特色？","options":["全詩四句，每句五字，通常第二、四句押韻","全詩五句，每句四字，首尾必須押韻","全詩八句，每句五字，每句都押韻","全詩四句，每句七字，第二、三句押韻"],"answer":0,"hint":"統整活動三指出：絕句四句，字數固定，第二、四句有押韻。"},{"q":"同學寫「操場上只有球落地的咚咚聲，午后的校園顯得格外安靜」，最接近哪種詩歌描寫技巧？","options":["直接議論，提出校園管理的看法","以動襯靜，利用聲響突出環境安寧","以誇飾描寫球場人潮擁擠","倒敘事件，先寫結果再寫原因"],"answer":1,"hint":"聲音不一定代表吵雜，也可能反襯安靜。"},{"q":"若要把「春山很安靜」改寫成接近王維詩歌的意境，哪句最適合？","options":["春山真的非常安靜，完全沒有任何特色","春山有許多動物，大家都很喜歡春山","一聲清脆鳥鳴掠過山澗，林間又歸於幽靜","春山的遊客非常多，沿途攤販熱鬧叫賣"],"answer":2,"hint":"選擇能用具體景象和聲響營造意境的句子。"},{"q":"下列哪一句最能表現「以動襯靜」？","options":["夜裡偶爾傳來一聲蟲鳴，反使庭院顯得寂靜","山路上樹影搖曳，顯得景色十分活潑","市場傳來叫賣聲，讓街道更加熱鬧","夕陽照在湖面上，使湖水更加明亮"],"answer":0,"hint":"留意動態或聲響是否反而突出環境的寧靜。"},{"q":"〈鹿柴〉中「不見人」與「聞人語」並不矛盾，主要因為什麼？","options":["聲音能傳到眼睛看不見的地方","詩人先在山外，後在市集","作者把白天與夜晚混在一起","詩中的人語只是想像，並非真實"],"answer":0,"hint":"眼睛看見的範圍和耳朵聽見的範圍並不相同。"},{"q":"比較兩首王維的詩，下列哪一項最能說明它們的觀察角度？","options":["都只描寫人物動作","都以大量對話呈現事件","藉聲音、光影等細節，表現自然的幽靜","以議論說明環境保護的重要"],"answer":2,"hint":"注意兩首詩如何從具體感官線索創造意境。"},{"q":"「空山不見人」的「空」，若依詩境解讀，哪項最精確？","options":["說明山體內部有廣大的洞穴","表示山中絕對沒有任何生命活動","形容詩人內心毫無想法","強調視野中不見人影，營造空寂之感"],"answer":3,"hint":"從下一句仍聽得見人語，判斷「空」的程度。"},{"q":"「但聞人語響」的「但」在此較接近哪一種語意？","options":["但是，表示人聲與山林相互衝突","於是，表示時間先後","只、僅，限制詩人所感知的事物","即使，強調假設條件"],"answer":2,"hint":"連接「不見」與「聞」，想想詩人究竟感受到什麼。"},{"q":"「返景入深林」中的「返景」，最符合教師用書的解釋是？","options":["夕陽餘光反照山林","遊客返回山林時看到的景色","清晨陽光首次照入樹林","溪水倒映山林的全貌"],"answer":0,"hint":"「景」在此與光影有關，注意時間與光線。"},{"q":"下列哪組形近字使用完全正確？","options":["山澗流水、溫潤如玉","山潤流水、溫澗如玉","山澗流水、溫澗如玉","山潤流水、溫潤如玉"],"answer":0,"hint":"「澗」與山中流水相關，「潤」與滋潤相關。"},{"q":"「他雖然屢獲佳績，仍願意聽取同學建議。」最適合形容他的成語是？","options":["虛懷若谷","萬籟俱寂","如虎添翼","文情並茂"],"answer":0,"hint":"成語要對應人物的態度，而非成就。"},{"q":"哪一句最恰當使用「心曠神怡」？","options":["走出山洞看見遼闊草原，令人心曠神怡","面對突如其來的考試，他心曠神怡得坐立難安","爭吵聲不斷，大家心曠神怡地捂住耳朵","他因為迷路而心曠神怡，急得團團轉"],"answer":0,"hint":"留意成語含有心情開朗、精神愉悅之意。"},{"q":"〈鳥鳴澗〉「月出驚山鳥」的「驚」在詩中較適合解讀為？","options":["月光出現使山鳥有所驚動","獵人突然大喊把山鳥嚇跑","山鳥因暴風雨而驚慌失措","山鳥被人群追逐而驚飛"],"answer":0,"hint":"題目考詩句本身提供的線索。"},{"q":"下列對「萬籟俱寂」與「鴉雀無聲」的比較，何者最精確？","options":["兩者都可表安靜，但前者更強調萬物聲響沉寂","兩者都指人聲鼎沸，只是語氣不同","前者專指教室安靜，後者專指山林","前者形容聲音悅耳，後者形容景色幽美"],"answer":0,"hint":"比較詞義的共同點與側重點。"},{"q":"若用「空山不見人，但聞人語響」分析修辭，最適切的判斷是？","options":["以「不見」與「但聞」形成映襯，突顯山中幽靜","以連續的擬人讓山林開口說話","以層遞描述人數越來越多","以誇飾強調人聲震耳欲聾"],"answer":0,"hint":"教師修辭表將此句列為映襯。"},{"q":"「溪谷」「幽靜」「漆黑」三詞依序主要描寫什麼？","options":["地形環境、氣氛、光線","人物外貌、天氣、動作","時間長短、聲音大小、人物態度","動物習性、顏色變化、情節結果"],"answer":0,"hint":"分別抓住各詞的核心語義。"}]},{"name":"葫蘆祕境","emoji":"🌿","lesson":"葫蘆瓜","questions":[{"q":"〈葫蘆瓜〉同時描寫植物與女兒的成長，這樣的安排最主要有何效果？","options":["讓植物生長的過程與人物心境互相映照","使文章完全變成種植技術的說明書","暗示女兒的成長與照顧無關","讓讀者只注意葫蘆的外形"],"answer":0,"hint":"比較「葫蘆長大」和「女兒學會關懷」兩條線索。"},{"q":"如果作者只寫「葫蘆終於結果了」，最可能失去哪一層重要意義？","options":["植物成熟需要時間","作者與女兒的對話次數","女兒在照顧生命中培養的耐心與關懷","後院適合栽種植物"],"answer":2,"hint":"作者真正珍視的收穫不只是果實。"},{"q":"下列哪一個事例最能呼應〈葫蘆瓜〉「用愛耕耘」的精神？","options":["定期觀察、調整照顧方式，即使沒有立刻開花仍持續用心","每天固定澆相同水量，不管植物生長狀況如何","看到花開才開始記錄，重點放在最後收成","為了讓植物長快，直接替換生長緩慢的植株"],"answer":0,"hint":"選出同時具備行動、耐心與關懷的例子。"},{"q":"「鐵絲網牆披上了青綠的彩裝」一句，哪一項分析最合理？","options":["以精確數據說明藤蔓長度","以設問引發讀者思考","以引用法增加文章可信度","將牆或植物的變化寫得像人穿上衣服，使畫面生動"],"answer":3,"hint":"「披上彩裝」把景物寫得像人的行為。"},{"q":"哪一組事件排列最符合〈葫蘆瓜〉的敘事脈絡？","options":["播種與照顧→生長開花→結果→體會成長意義","結果→播種→開花→開始照顧","先談收成→放棄種植→突然結果","開花→結果→播種→長出新芽"],"answer":0,"hint":"依照種植歷程及作者最後的體悟排序。"},{"q":"如果要為〈葫蘆瓜〉擬一個兼顧事件與主旨的副標題，哪個最恰當？","options":["鐵絲網的建築方法","如何讓每棵植物一天長大","從一株葫蘆，看見耐心與關懷的成長","庭院植物品種完整介紹"],"answer":2,"hint":"好的標題要兼顧具體事件和文章中心思想。"},{"q":"下列哪一項最適合用作〈葫蘆瓜〉的閱讀心得，而非單純摘要？","options":["我明白照顧生命需要耐心，往後也想用心照顧班上的植物","我整理出女兒種植葫蘆的主要事件與時間","我按照段落順序記下葫蘆開花和結果的經過","我列出作者描述鐵絲網與藤蔓的具體詞句"],"answer":0,"hint":"心得需要包含讀後的理解或自己的感受。"},{"q":"寫〈葫蘆瓜〉的閱讀心得時，哪一項最能從事件推論人物成長？","options":["葫蘆的藤蔓長得很長","因為女兒持續照料植物，可以看出她逐漸學會負責","植物需要水和陽光","作者家裡有一面牆"],"answer":1,"hint":"人物成長要從具體行為找到證據。"},{"q":"若要表達「關懷不是只在順利時付出」，哪一例子最能呼應課文？","options":["花開時拍照，枯萎時立刻丟棄","只關心是否能收成，不在意過程","遇到病蟲害時先觀察原因，再耐心調整照料方式","不論植物狀態如何，都完全不改變照顧方式"],"answer":2,"hint":"關懷除了持續，也需要觀察與調整。"},{"q":"一位同學說「文章寫植物，所以主旨只是種植技巧」，哪項回應最有說服力？","options":["對，所有植物文章都是說明文","不對，因為植物不能當文章主角","不一定，要看作者是否藉種植過程傳達親子成長與關懷","對，因為文章有提到播種"],"answer":2,"hint":"主旨不一定等於文章表面寫到的事物。"},{"q":"如果一段敘述只列出澆水、施肥日期，卻未提女兒的反應，最可能缺少哪種層次？","options":["記錄事件先後的功能","作者所使用的標點符號","人物如何在照料過程中改變的線索","植物生長需要環境的知識"],"answer":2,"hint":"課文除了寫植物，也寫人的成長。"},{"q":"「葫蘆瓜長得愈來愈好，女兒也愈來愈懂得等待」，這種寫法主要運用什麼安排？","options":["以倒敘交代植物死亡的原因","以客觀數據比較不同品種","以兩條相互呼應的成長線索深化主題","以相反的結果否定照顧的價值"],"answer":2,"hint":"辨別植物變化與人物變化的關聯。"},{"q":"「藤蔓沿著鐵絲網向上攀爬」中的「攀」與哪個詞義最接近？","options":["攀登","高攀","攀誣","攀扯"],"answer":0,"hint":"比較同一個字在不同語詞中的意思。"},{"q":"在「鄰、憐、遴」三字中，下列哪一組用字完全正確？","options":["鄰居、憐愛、遴選","鄰居、憐愛、鄰選","鄰居、鄰愛、遴選","憐居、憐愛、遴選"],"answer":0,"hint":"三字同音近形，意思卻不同。"},{"q":"「遇到不熟悉的任務，先蒐集資料、確認步驟，再逐步執行。」最符合哪個成語？","options":["步步為營","依樣畫葫蘆","以鄰為壑","攀龍附鳳"],"answer":0,"hint":"關鍵是謹慎規畫、穩紮穩打。"},{"q":"「只會照著別人的作品模仿，沒有自己的想法」最貼近哪個成語？","options":["依樣畫葫蘆","開誠布公","扶老攜幼","左顧右盼"],"answer":0,"hint":"留意是否具有「缺乏創見」的意思。"},{"q":"「把自己的問題推給隔壁班承擔」最適合用哪個成語批評？","options":["以鄰為壑","虛懷若谷","步步為營","如虎添翼"],"answer":0,"hint":"這個成語有將困難轉嫁他人的意思。"},{"q":"「花開後蜜蜂營營、蝴蝶翩翩」的「營營」在此最貼近哪種表達？","options":["蜜蜂活動時的聲響與忙碌景象","蜜蜂正在經營商店","蝴蝶因為營養不足而飛不起來","花朵發出像軍營號角的聲音"],"answer":0,"hint":"不要只依「營」字的其他字義推論。"},{"q":"若將「藤蔓像堅實的腳掌，一步一步沿牆攀爬」改成「藤蔓長得很快」，主要損失什麼？","options":["以譬喻和動態描寫呈現生長過程的形象","對植物品種的精確科學分類","證明藤蔓真的長出了腳掌","對種植成本的詳細分析"],"answer":0,"hint":"比較形象化寫法與概括敘述。"},{"q":"根據課文結構表，哪項最能概括〈葫蘆瓜〉最後兩段的作用？","options":["從瓜的生長轉向女 {names:['聆聽卷軸','聲波羅盤','音符鑰匙'],knowledge:'〈你一定會聽見的〉運用設問、狀聲詞與想像，提醒讀者留意平常容易忽略的細微聲音。',strategy:'判斷修辭時，分清狀聲摹寫、把事物當人寫的轉化，以及重複句式的類疊。'},
{names:['善意手札','關懷羅盤','希望鑰匙'],knowledge:'〈藍色連身裙〉透過女孩、家庭與街坊逐步改變的故事，傳達小小善意可能產生連鎖影響。',strategy:'整理故事因果時，按先後找出人物的行動與改變；推論寓意必須有情節證據。'}
];
const KEY='chinese-adventure-v7-audited';
let state=load(),view='home',zoneId=0,selected=-1,feedback='',attempts=0,objectStep=0,stage='questions',answeredIndex=null;
function fresh(name=''){return{name,round:1,exploration:{},complete:Array(6).fill(false),finalComplete:false,results:{},selection:{},order:{},history:[],wrongCounts:{},started:Date.now(),finished:null}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.complete)?x:fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function root(s){document.getElementById('main').innerHTML=s;document.getElementById('who').textContent=state.name?'冒險者：'+state.name+'｜第'+state.round+'輪':'尚未登入'}
function btn(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function pool(key){return key==='final'?DATA.final:DATA.zones[Number(key.slice(1))].questions}
function count(key){return key==='final'?8:7}
function previousSeen(key){return new Set(state.history.flatMap(r=>r.selection?.[key]||[]))}
function pick(key){let n=count(key),ids=pool(key).map((_,i)=>i),seen=previousSeen(key);
let shuffled=shuffle(ids).sort((a,b)=>{let va=(state.wrongCounts[key+':'+a]||0)>0?-200:(seen.has(a)?100:0),vb=(state.wrongCounts[key+':'+b]||0)>0?-200:(seen.has(b)?100:0);return va-vb});
return shuffled.slice(0,n)}
function ensureSelection(key){if(!state.selection[key]){state.selection[key]=pick(key);save()}return state.selection[key]}
function optionOrder(key,index){let id=key+':'+index;if(!state.order[id]){state.order[id]=shuffle([0,1,2,3]);save()}return state.order[id]}
function home(){view='home';root(`<section class="panel hero"><div style="font-size:70px">🗺️✨🐻</div><h1>失落的文字寶藏</h1><p class="sub">六大領域自由探索 · 150題進階題庫 · 每輪隨機50題 · 多輪勇者認證</p>${state.name?`<h2>歡迎回來，${h(state.name)}！</h2><p>第 ${state.round} 輪冒險</p>${btn('進入冒險地圖','map()')}`:`<p>請輸入學生姓名，開始冒險</p><input id="name" maxlength="20" placeholder="學生姓名" autocomplete="off">${btn('開始冒險','start()')}`}<p class="sub">答錯先給提示，完成後進入錯題修練。每輪題目及選項順序不同。</p></section>`)}
function start(){let name=document.getElementById('name').value.trim();if(!name)return alert('請輸入姓名');state=fresh(name);save();map()}
function map(){view='map';let done=state.complete.filter(Boolean).length;root(`<section class="panel"><h2>🗺️ 六大奇幻領域</h2><p>歡迎，${h(state.name)}！第 ${state.round} 輪，任選區域探索。</p><div class="progress"><div style="width:${done/6*100}%"></div></div><p>已取得 ${done}/6 枚區域徽章</p><div class="map">${DATA.zones.map((z,i)=>`<button class="zone" onclick="enter(${i})"><div class="emoji">${z.emoji}</div><strong>${z.name}</strong><small>${z.lesson}</small><p class="pill">${state.complete[i]?'🏅 已完成':'🔍 前往探索'}</p></button>`).join('')}</div><div style="margin-top:20px;text-align:center"><button class="zone ${done<6?'locked':''}" style="width:100%;max-width:400px" onclick="enterFinal()"><div class="emoji">🏰</div><strong>最終挑戰：國語智慧之城</strong><span class="pill">${state.finalComplete?'🏆 已通關':done<6?'🔒 蒐集六枚徽章後解鎖':'🔓 可以挑戰'}</span></button></div>${state.finalComplete?btn('查看本輪滿分勇者認證','certificate()'):''}${state.finalComplete?btn('開啟下一輪隨機冒險','newRound()','ghost'):''}${state.history.length?btn('歷次認證紀錄','historyView()','ghost'):''}<p class="sub">每區從20題抽7題；最終從30題抽8題。進度只保存在目前瀏覽器。</p>${btn('更換學生／清除本機紀錄','resetAsk()','ghost')}</section>`)}
function resetAsk(){if(confirm('確定清除本機所有遊戲進度及歷次認證嗎？此操作無法復原。')){state=fresh();save();home()}}
function enter(i){zoneId=i;view='zone';selected=-1;feedback='';attempts=0;answeredIndex=null;
let progress=state.exploration?.['z'+i]||0;objectStep=progress;
stage=state.complete[i]?'done':(state.results['z'+i]?.passed?.length===7?(state.results['z'+i].wrong?.length?'repair':'questions'):(state.selection['z'+i]?'questions':(progress>=3?'ready':'explore')));zone()}
function zone(){let z=DATA.zones[zoneId];if(stage==='done'){root(`<section class="panel hero"><div style="font-size:60px">${z.emoji}🏅</div><h2>${z.name}探索完成！</h2><p>已獲得本輪的文字徽章。</p>${btn('返回地圖','map()')}</section>`);return}
if(stage==='explore'||stage==='ready'){
let ex=EXPLORE[zoneId],step=state.exploration?.['z'+zoneId]||0;
let labels=['📜','🧭','🗝️'];
let cards=labels.map((emoji,i)=>{let unlocked=i<=step,done=i<step;return `<button class="object ${unlocked?'':'locked'}" ${unlocked?'':'disabled'} onclick="explore(${i})" aria-label="${h(ex.names[i])}${done?'已探索':unlocked?'可探索':'尚未解鎖'}">${emoji}<small>${h(ex.names[i])}</small><small>${done?'✓ 已探索':unlocked?'點擊探索':'🔒 待解鎖'}</small></button>`}).join('');
let info=step===0?'先閱讀第一份知識線索，接著掌握解題策略。':step===1?`<strong>📜 知識線索</strong><p>${h(ex.knowledge)}</p><small>接著點選羅盤，取得解題策略。</small>`:step===2?`<strong>📜 知識線索</strong><p>${h(ex.knowledge)}</p><strong>🧭 思考提示</strong><p>${h(ex.strategy)}</p><small>已蒐集兩份線索，點擊鑰匙開啟試煉。</small>`:`<strong>📜 知識線索</strong><p>${h(ex.knowledge)}</p><strong>🧭 思考提示</strong><p>${h(ex.strategy)}</p><strong>🗝️ 試煉鑰匙已取得！</strong><p>準備好就進入本區七題挑戰。</p>`;
root(`<section class="panel"><h2>${z.emoji} ${z.name}</h2><p>依序探索三個物件，蒐集知識與思考策略，再開啟試煉。</p><div class="objects">${cards}</div><div class="hint" aria-live="polite">${info}</div>${step>=3?btn('開啟七題試煉','beginZone()'):''}${btn('返回地圖','map()','ghost')}</section>`);return}
renderQuiz('z'+zoneId,stage==='repair'?'錯題修練':'七題試煉')}
function explore(i){let key='z'+zoneId,step=state.exploration?.[key]||0;if(i!==step||step>=3)return;if(!state.exploration)state.exploration={};state.exploration[key]=step+1;objectStep=step+1;stage=objectStep>=3?'ready':'explore';save();zone()}
function beginZone(){if((state.exploration?.['z'+zoneId]||0)<3)return;ensureSelection('z'+zoneId);stage='questions';zone()}
function enterFinal(){if(state.complete.some(x=>!x))return alert('請先完成六大區域');zoneId=-1;stage=state.finalComplete?'done':(state.results.final?.passed?.length===8&&state.results.final?.wrong?.length?'repair':'questions');answeredIndex=null;selected=-1;feedback='';attempts=0;ensureSelection('final');finalView()}
function finalView(){if(stage==='done'){certificate();return}renderQuiz('final',stage==='repair'?'最終錯題修練':'最終八題挑戰')}
function getRec(key){if(!state.results[key])state.results[key]={passed:[],wrong:[],repaired:[]};return state.results[key]}
function renderQuiz(key,title){let qs=pool(key),selection=ensureSelection(key),rec=getRec(key),repair=stage==='repair';
let index=repair?rec.wrong.find(i=>!rec.repaired.includes(i)):selection.find(i=>!rec.passed.includes(i));
if(feedback==='correct'&&answeredIndex!==null)index=answeredIndex;
if(index===undefined){if(repair||rec.wrong.length===0){finish(key);return}stage='repair';answeredIndex=null;selected=-1;feedback='';attempts=0;return renderQuiz(key,'錯題修練')}
let q=qs[index],done=repair?rec.repaired.length:rec.passed.length,ord=optionOrder(key,index),position=selection.indexOf(index);
root(`<section class="panel"><p class="pill">${key==='final'?'🏰 國語智慧之城':DATA.zones[zoneId].emoji+' '+DATA.zones[zoneId].name} · ${title}</p><h2>${repair?'重新思考錯題':'任務 '+(position+1)+' / '+selection.length}</h2><div class="progress"><div style="width:${done/selection.length*100}%"></div></div><p class="question">${h(q.q)}</p>${ord.map((original,i)=>`<button class="option ${selected===original?'selected':''}" onclick="choose(${original})">${'ABCD'[i]}. ${h(q.options[original])}</button>`).join('')}${feedback?`<div class="${feedback==='correct'?'ok':'hint'}">${feedback==='correct'?'✨ 回答正確！':h(feedback)}</div>`:''}${btn(feedback==='correct'?'繼續冒險':'確認答案','submitAnswer()')}${btn('返回地圖','map()','ghost')}</section>`)}
function choose(i){if(feedback==='correct')return;selected=i;feedback='';refresh()}
function refresh(){if(zoneId<0)finalView();else zone()}
function submitAnswer(){let key=zoneId<0?'final':'z'+zoneId,qs=pool(key),rec=getRec(key),repair=stage==='repair',index=repair?rec.wrong.find(i=>!rec.repaired.includes(i)):ensureSelection(key).find(i=>!rec.passed.includes(i));
if(feedback==='correct'){selected=-1;feedback='';answeredIndex=null;attempts=0;refresh();return}
if(selected<0)return alert('請先選擇答案');
if(selected===qs[index].answer){if(repair){if(!rec.repaired.includes(index))rec.repaired.push(index)}else{if(!rec.passed.includes(index))rec.passed.push(index)}
answeredIndex=index;feedback='correct';save();refresh()
}else{attempts++;if(!repair&&!rec.wrong.includes(index))rec.wrong.push(index);state.wrongCounts[key+':'+index]=(state.wrongCounts[key+':'+index]||0)+1;feedback=attempts===1?'💡 提示：'+qs[index].hint:'🔎 再看一次題目與各選項，排除和課文主旨不一致的說法。';save();refresh()}}
function finish(key){if(key==='final'){state.finalComplete=true;state.finished=Date.now();save();certificate()}else{state.complete[zoneId]=true;save();stage='done';zone()}}
function newRound(){if(!state.finalComplete)return alert('請先完成這一輪');if(!confirm('開始第 '+(state.round+1)+' 輪？本輪獎狀會保留在歷次認證紀錄中。'))return;
state.history.push({round:state.round,finished:state.finished,selection:JSON.parse(JSON.stringify(state.selection)),name:state.name});
state.round++;state.exploration={};state.complete=Array(6).fill(false);state.finalComplete=false;state.results={};state.selection={};state.order={};state.finished=null;state.started=Date.now();save();map()}
function historyView(){view='history';root(`<section class="panel"><h2>🏅 歷次認證紀錄</h2><p>已完成 ${state.history.length+(state.finalComplete?1:0)} 輪</p>${state.history.map((r,i)=>`<p class="pill">第 ${r.round} 輪 · ${new Date(r.finished).toLocaleDateString('zh-TW')} ${btn('查看獎狀','oldCert('+i+')','ghost')}</p>`).join('<br>')}${state.finalComplete?`<p>${btn('查看本輪獎狀','certificate()')}</p>`:''}<p>${btn('返回地圖','map()','ghost')}</p></section>`)}
function oldCert(i){let r=state.history[i];if(!r)return historyView();certificateFor(r.name,r.round,r.finished)}
function certificate(){if(!state.finalComplete)return map();certificateFor(state.name,state.round,state.finished)}
function certificateFor(name,round,finished){view='cert';let date=new Date(finished||Date.now()).toLocaleDateString('zh-TW');root(`<section class="panel hero"><div id="certview" style="background:linear-gradient(135deg,#fffaf0,#e9f5fa);border:8px double #d5b16a;border-radius:18px;padding:30px 12px"><div style="font-size:60px">🏆✨</div><p>511班・國語大冒險</p><h1>滿分勇者認證書</h1><h2 style="font-size:30px">${h(name)}</h2><p>第 ${round} 輪冒險 · 完成50題挑戰<br>所有錯題均已完成訂正</p><h2>🏅 傳說級國語冒險家</h2><p>完成日期：${date}</p><small>此為自主學習紀錄，請交由老師確認。</small></div><p>${btn('儲存獎狀圖片','downloadCert()')}${btn('返回地圖','map()','ghost')}</p><p class="sub">獎點由老師核對後發放；本機離線紀錄不具防偽功能。</p></section>`);
window.currentCert={name,round,finished}}
function downloadCert(){let {name,round,finished}=window.currentCert||{name:state.name,round:state.round,finished:state.finished};let c=document.createElement('canvas');c.width=1200;c.height=850;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,1200,850);g.addColorStop(0,'#fff9e9');g.addColorStop(1,'#dff2fa');x.fillStyle=g;x.fillRect(0,0,1200,850);x.strokeStyle='#cda95f';x.lineWidth=15;x.strokeRect(35,35,1130,780);x.strokeStyle='#e3c989';x.lineWidth=3;x.strokeRect(58,58,1084,734);x.textAlign='center';x.fillStyle='#8d7039';x.font='bold 30px Microsoft JhengHei';x.fillText('511班 · 國語大冒險',600,150);x.font='bold 64px Microsoft JhengHei';x.fillText('滿分勇者認證書',600,265);x.fillStyle='#355b71';x.font='bold 65px Microsoft JhengHei';x.fillText(name,600,380);x.font='30px Microsoft JhengHei';x.fillText('第 '+round+' 輪冒險 · 完成50題挑戰',600,480);x.fillText('所有錯題均已完成訂正',600,530);x.fillStyle='#ac843d';x.font='bold 38px Microsoft JhengHei';x.fillText('傳說級國語冒險家',600,620);x.font='24px Microsoft JhengHei';x.fillText('完成日期：'+new Date(finished||Date.now()).toLocaleDateString('zh-TW'),600,700);x.font='18px Microsoft JhengHei';x.fillText('自主學習紀錄 · 由老師核對後發放班級獎點',600,760);let a=document.createElement('a');a.download='國語大冒險_第'+round+'輪_滿分勇者_'+name+'.png';a.href=c.toDataURL('image/png');a.click()}
home();
</script></body></html>
